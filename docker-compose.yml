# Convenience wrapper for local runs: `docker compose up --build`.
# The Jenkins pipeline uses plain `docker` commands instead, so the two paths
# stay independent.
services:
  app:
    build: .
    image: speaker-session-manager:local
    container_name: speaker-session-manager
    ports:
      - "8080:8080"
    environment:
      APP_ENV: docker-compose
      SEED_DEMO_DATA: "true"
      # Override the demo passwords here rather than in the image.
      SPEAKER_PASSWORD: speaker123
      REVIEWER_PASSWORD: reviewer123
      ORGANIZER_PASSWORD: organizer123
    volumes:
      - speaker-data:/app/data
    restart: unless-stopped

volumes:
  speaker-data:
