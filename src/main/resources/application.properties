spring.application.name=speaker-session-manager

# ---- Server -----------------------------------------------------------------
# PORT lets Docker / Ansible move the app without rebuilding the WAR.
server.port=${PORT:8080}

# ---- Database ---------------------------------------------------------------
# File-based H2: survives restarts, needs nothing installed.
# Point DB_URL at MySQL/Postgres later without touching the code.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/speakerdb;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- Demo accounts ----------------------------------------------------------
# Development values only. Override with env vars for any real deployment.
app.users.speaker.password=${SPEAKER_PASSWORD:speaker123}
app.users.reviewer.password=${REVIEWER_PASSWORD:reviewer123}
app.users.organizer.password=${ORGANIZER_PASSWORD:organizer123}

# ---- Behaviour --------------------------------------------------------------
app.seed-demo-data=${SEED_DEMO_DATA:true}
# Shown in the page footer so you can tell which build is deployed.
app.environment=${APP_ENV:local}

# ---- Health check used by Jenkins and Ansible -------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
