<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard · Speaker Sessions</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div th:replace="~{fragments/nav :: nav}"></div>

<main class="container">
    <h1 id="page-title">Dashboard</h1>

    <section class="stat-row">
        <div class="stat">
            <span class="stat-value" id="stat-total" th:text="${total}">0</span>
            <span class="stat-label">Total sessions</span>
        </div>
        <div class="stat" th:each="entry : ${countsByStatus}">
            <span class="stat-value"
                  th:id="'stat-' + ${entry.key.name().toLowerCase()}"
                  th:text="${entry.value}">0</span>
            <span class="stat-label" th:text="${entry.key.label}">Status</span>
        </div>
    </section>

    <section class="panel">
        <h2>Sessions per track</h2>
        <table id="track-table" class="table">
            <thead>
            <tr><th>Track</th><th>Sessions</th></tr>
            </thead>
            <tbody>
            <tr th:each="entry : ${countsByTrack}">
                <td th:text="${entry.key.label}">Track</td>
                <td th:text="${entry.value}">0</td>
            </tr>
            </tbody>
        </table>
    </section>

    <section class="panel">
        <h2>Next scheduled sessions</h2>
        <p id="no-upcoming" class="muted" th:if="${upcoming.isEmpty()}">
            Nothing scheduled yet.
        </p>
        <table id="upcoming-table" class="table" th:unless="${upcoming.isEmpty()}">
            <thead>
            <tr><th>Title</th><th>Speaker</th><th>Starts</th><th>Room</th></tr>
            </thead>
            <tbody>
            <tr th:each="s : ${upcoming}">
                <td><a th:href="@{'/sessions/' + ${s.id}}" th:text="${s.title}">Title</a></td>
                <td th:text="${s.speakerName}">Speaker</td>
                <td th:text="${s.startTimeDisplay}">Date</td>
                <td th:text="${s.room} ?: '—'">Room</td>
            </tr>
            </tbody>
        </table>
    </section>
</main>

<div th:replace="~{fragments/nav :: footer}"></div>

</body>
</html>
