<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · Speaker Sessions</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-page">

<main class="login-card">
    <h1>Speaker Sessions</h1>
    <p class="muted">Sign in to manage talk proposals.</p>

    <div id="login-error" class="alert error" th:if="${param.error}">
        Wrong username or password.
    </div>
    <div id="logout-message" class="alert" th:if="${param.loggedOut}">
        You have been signed out.
    </div>

    <form th:action="@{/login}" method="post">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button id="login-button" type="submit" class="primary">Sign in</button>
    </form>

    <div class="demo-accounts">
        <p class="muted">Or sign in with one click as:</p>
        <div class="demo-buttons">
            <form th:action="@{/demo-login}" method="post">
                <input type="hidden" name="username" value="speaker">
                <button id="demo-speaker" type="submit" class="button">Speaker</button>
            </form>
            <form th:action="@{/demo-login}" method="post">
                <input type="hidden" name="username" value="reviewer">
                <button id="demo-reviewer" type="submit" class="button">Reviewer</button>
            </form>
            <form th:action="@{/demo-login}" method="post">
                <input type="hidden" name="username" value="organizer">
                <button id="demo-organizer" type="submit" class="button">Organizer</button>
            </form>
        </div>
    </div>
</main>

</body>
</html>
