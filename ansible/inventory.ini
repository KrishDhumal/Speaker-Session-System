# The single place to change where the application gets deployed.
#
# Right now everything runs on this machine. To deploy to a real VM instead,
# replace the localhost line with something like:
#   speaker-node ansible_host=192.168.56.10 ansible_user=ubuntu
# and delete ansible_connection=local. Nothing else needs to change.

[speaker_servers]
speaker-node ansible_connection=local

[speaker_servers:vars]
app_name=speaker-session-manager
app_port=8080
app_env=ansible
image_name=speaker-session-manager
image_tag=latest
app_dir=/opt/speaker-session-manager
